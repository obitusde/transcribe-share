<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transkription Upload</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2c3e50">
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 3rem auto; padding: 0 1rem; text-align: center; color: #2c3e50; }
  .status { padding: 1.25rem; border-radius: 8px; margin-top: 1.5rem; display: flex; flex-direction: column; align-items: center; gap: 0.6rem; }
  .status.ok { background: #e6f4ea; color: #1e7e34; }
  .status.error { background: #fdecea; color: #b71c1c; }
  .status.loading { background: #eef1f4; color: #2c3e50; }
  .status .detail { font-size: 0.8rem; margin-top: 0.25rem; word-break: break-all; opacity: 0.85; }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid rgba(44,62,80,0.2); border-top-color: #2c3e50;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { color: #777; font-size: 0.9rem; margin-top: 2.5rem; }
</style>
</head>
<body>
  <h1>🎙️ Transkription Upload</h1>
  <p>Diese Seite empfängt geteilte Sprachmemos aus dem Google Recorder und schickt sie automatisch zur Transkription.</p>
  <div id="result"></div>
  <p class="hint">Zum Nutzen: diese Seite zum Homescreen hinzufügen. Danach erscheint sie nach dem Stoppen einer Aufnahme im Recorder-"Teilen"-Menü.</p>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxkkdYTJi24p-f0BY9M3SbnpPYEBQcxjclpJ3K1pUKbolUqb4DpuaM7XfAwE5KRHWc8ig/exec';
const CACHE_VERSION = 'transcribe-share-v3';
const SHARE_CACHE_KEY = './__shared-file__';
const STATUS_POLL_INTERVAL_MS = 4000;
const STATUS_POLL_TIMEOUT_MS = 5 * 60 * 1000; // 5 Minuten, danach Hinweis statt Endlos-Polling
const UPLOAD_TIMEOUT_MS = 90 * 1000; // 90 Sekunden fuer den eigentlichen Upload-Request

if ('serviceWorker' in navigator) {
  // .update() erzwingt eine sofortige Pruefung auf eine neue Service-Worker-
  // Version, statt auf Chromes eigenen (bis zu 24h) Update-Timer zu warten.
  navigator.serviceWorker.register('./service-worker.js').then((reg) => reg.update());
}

const PENDING_KEY = 'pendingTranscription';
const IN_PROGRESS_KEY = 'shareUploadInProgress';
const IN_PROGRESS_STALE_MS = 3 * 60 * 1000; // 3 Minuten, danach als verloren betrachten

const params = new URLSearchParams(location.search);
const status = params.get('status');
const message = params.get('message');
const sharePending = params.get('share') === 'pending';

if (sharePending) {
  history.replaceState({}, '', location.pathname);
  showLoading('Geteilte Datei wird verarbeitet …');
  handleSharedFile();
} else if (status) {
  history.replaceState({}, '', location.pathname);
  showResult(status, message);
} else {
  // Kein frischer Share-Aufruf, aber evtl. laeuft noch eine Transkription von
  // vorhin - nach einem Reload nicht einfach den leeren Default-Screen
  // zeigen, sondern das Polling fortsetzen (oder zumindest einen Hinweis
  // zeigen, falls der Upload selbst noch lief).
  resumePendingIfAny();
}

function resumePendingIfAny() {
  try {
    const raw = localStorage.getItem(PENDING_KEY);
    if (raw) {
      const pending = JSON.parse(raw);
      if (pending && pending.fileName && pending.startedAt && Date.now() - pending.startedAt <= STATUS_POLL_TIMEOUT_MS) {
        showLoading('Transkription läuft …');
        pollStatus(pending.fileName, pending.startedAt);
        return;
      }
      localStorage.removeItem(PENDING_KEY);
    }
  } catch (e) {
    localStorage.removeItem(PENDING_KEY);
  }

  // Kein bekannter Polling-Status, aber evtl. war ein Upload unterwegs, als
  // die Seite neu geladen wurde (die Original-Datei ist dann weg, ein echtes
  // Fortsetzen ist nicht moeglich - aber wenigstens ein hilfreicher Hinweis
  // statt der leeren Default-Seite).
  try {
    const rawInProgress = localStorage.getItem(IN_PROGRESS_KEY);
    if (rawInProgress) {
      const inProgress = JSON.parse(rawInProgress);
      localStorage.removeItem(IN_PROGRESS_KEY);
      if (inProgress && inProgress.startedAt && Date.now() - inProgress.startedAt <= IN_PROGRESS_STALE_MS) {
        showResult('error', '', '⚠️ Die Seite wurde während eines laufenden Uploads neu geladen. Bitte prüfe kurz dein E-Mail-Postfach oder teile die Datei erneut.');
      }
    }
  } catch (e) {
    localStorage.removeItem(IN_PROGRESS_KEY);
  }
}

async function handleSharedFile() {
  try {
    const cache = await caches.open(CACHE_VERSION);
    const cached = await cache.match(SHARE_CACHE_KEY);

    if (!cached) {
      showResult('error', 'Keine geteilte Datei im Zwischenspeicher gefunden.');
      return;
    }

    const filename = decodeURIComponent(cached.headers.get('X-Shared-Filename') || 'share-upload.m4a');
    const mimeType = cached.headers.get('Content-Type') || 'audio/mp4';
    const blob = await cached.blob();
    await cache.delete(SHARE_CACHE_KEY);

    localStorage.setItem(IN_PROGRESS_KEY, JSON.stringify({ startedAt: Date.now() }));

    const sizeMb = Math.round(blob.size / 1024 / 1024 * 10) / 10;
    showLoading(`Wird hochgeladen … (${filename}, ${sizeMb} MB)`);

    const base64 = await blobToBase64(blob);

    const uploadStartedAt = Date.now();
    const tickInterval = setInterval(() => {
      const s = Math.round((Date.now() - uploadStartedAt) / 1000);
      showLoading(`Wird hochgeladen … (${filename}, ${sizeMb} MB, ${s}s)`);
    }, 1000);

    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), UPLOAD_TIMEOUT_MS);

    let res;
    try {
      res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ filename, mimeType, data: base64 }),
        signal: controller.signal
      });
    } catch (fetchError) {
      clearInterval(tickInterval);
      clearTimeout(timeoutId);
      localStorage.removeItem(IN_PROGRESS_KEY);
      if (fetchError.name === 'AbortError') {
        showResult('error', '', `❌ Upload dauerte länger als ${UPLOAD_TIMEOUT_MS / 1000}s und wurde abgebrochen. Bitte erneut versuchen (evtl. mit besserem Netz).`);
      } else {
        showResult('error', fetchError.message);
      }
      return;
    }
    clearInterval(tickInterval);
    clearTimeout(timeoutId);

    const text = await res.text();
    let parsed = null;
    try {
      parsed = JSON.parse(text);
    } catch (e) {
      // Antwort war kein JSON.
    }

    if (!parsed || parsed.status !== 'ok') {
      localStorage.removeItem(IN_PROGRESS_KEY);
      showResult('error', text);
      return;
    }

    const transcription = parsed.transcription;
    if (!transcription || transcription.status !== 'processing' || !transcription.fileName) {
      localStorage.removeItem(IN_PROGRESS_KEY);
      const detail = transcription ? transcription.message : 'Transkription wurde nicht gestartet.';
      showResult('error', `Hochgeladen, aber Transkription nicht gestartet: ${detail}`);
      return;
    }

    localStorage.removeItem(IN_PROGRESS_KEY);
    showLoading('Hochgeladen. Transkription läuft …');
    const startedAt = Date.now();
    localStorage.setItem(PENDING_KEY, JSON.stringify({ fileName: transcription.fileName, startedAt }));
    pollStatus(transcription.fileName, startedAt);

  } catch (error) {
    localStorage.removeItem(IN_PROGRESS_KEY);
    showResult('error', error.message);
  }
}

async function pollStatus(fileName, startedAt) {
  const elapsedSec = Math.round((Date.now() - startedAt) / 1000);

  if (Date.now() - startedAt > STATUS_POLL_TIMEOUT_MS) {
    localStorage.removeItem(PENDING_KEY);
    showLoading('Dauert länger als erwartet. Die E-Mail kommt trotzdem automatisch, sobald fertig.', true);
    return;
  }

  try {
    const res = await fetch(`${SCRIPT_URL}?action=status&file=${encodeURIComponent(fileName)}`);
    const data = await res.json();

    if (data.state === 'done') {
      localStorage.removeItem(PENDING_KEY);
      showResult('ok', '', '✅ Transkription abgeschlossen — E-Mail wurde versendet.');
      return;
    }
    if (data.state === 'error') {
      localStorage.removeItem(PENDING_KEY);
      showResult('error', '', '❌ Transkription ist fehlgeschlagen.');
      return;
    }
    // 'transcribing' oder 'unknown' (kurze Uebergangsphase direkt nach dem Upload) -> weiter warten.
    // Laufende Sekundenanzeige, damit klar ist: der Prozess haengt nicht, er arbeitet noch.
    showLoading(`Transkription läuft … (${elapsedSec}s)`);
  } catch (error) {
    showLoading(`Transkription läuft … (${elapsedSec}s, kurzer Verbindungsfehler, versuche weiter)`);
  }

  setTimeout(() => pollStatus(fileName, startedAt), STATUS_POLL_INTERVAL_MS);
}

function showLoading(text, final) {
  document.getElementById('result').innerHTML =
    `<div class="status loading">${final ? '' : '<div class="spinner"></div>'}<div>${text}</div></div>`;
}

function showResult(status, message, title) {
  const escaped = (message || '').replace(/</g, '&lt;');
  const heading = title || (status === 'ok' ? '✅ Erfolgreich hochgeladen.' : '❌ Fehler beim Hochladen.');
  document.getElementById('result').innerHTML = `<div class="status ${status === 'ok' ? 'ok' : 'error'}">
    <div>${heading}</div>
    ${escaped ? `<div class="detail">${escaped}</div>` : ''}
  </div>`;
}

function blobToBase64(blob) {
  // FileReader.readAsDataURL nutzt die native Browser-Implementierung statt
  // einer manuellen JS-Schleife + btoa() - bei groesseren Dateien auf
  // schwaecheren Mobilgeraeten spuerbar schneller (die alte Variante konnte
  // den Haupt-Thread laenger blockieren, bevor der Upload ueberhaupt startete).
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      resolve(result.substring(result.indexOf(',') + 1));
    };
    reader.onerror = () => reject(reader.error || new Error('Datei konnte nicht gelesen werden.'));
    reader.readAsDataURL(blob);
  });
}
</script>
</body>
</html>
